name: Olist Strategic Report Flow

on:
  schedule:
    # Chạy vào 08:00 sáng giờ Việt Nam (UTC 01:00) hàng ngày
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      theme:
        description: 'Chuyên đề (rfm, seller, basket, category, logistics, payment - để trống sẽ xoay vòng)'
        required: false
        default: ''

jobs:
  build-and-send:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập môi trường Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cài đặt thư viện phụ thuộc
        run: |
          pip install mysql-connector-python

      - name: Thực thi Báo cáo Chiến lược & Gửi Email
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          DB_HOST: ${{ secrets.DB_HOST || secrets.MYSQL_HOST }}
          DB_PORT: ${{ secrets.DB_PORT || secrets.MYSQL_PORT }}
          DB_USER: ${{ secrets.DB_USER || secrets.MYSQL_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD || secrets.MYSQL_PASSWORD || secrets.DB_PASS }}
          DB_NAME: ${{ secrets.DB_NAME || secrets.MYSQL_DATABASE }}
        run: |
          python strategic_report_flow.py ${{ github.event.inputs.theme }}
